[package]
name = "sentinel_guard"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rusqlite = { version = "0.9", features = ["bundled"] }
secrecy = "0.10"
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
infer = "0.19"
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
